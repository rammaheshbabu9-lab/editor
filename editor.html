<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>ప్రాంతీయ ప్రతిధ్వని NEWS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#071e30;
}

/* =====================================================
   HEADER
===================================================== */

.top-navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:65px;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 12px;
    background:#0b3c5d;
    color:#fff;
    border-bottom:3px solid #ffd700;
    box-shadow:0 3px 10px rgba(0,0,0,.35);
}

.header-left,
.header-right{
    width:45px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.profile-icon,
.notification-icon{
    width:38px;
    height:38px;
    border:2px solid #ffd700;
    border-radius:50%;
    background:rgba(255,215,0,.12);
    color:#ffd700;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:17px;
    position:relative;
}

.brand-title{
    flex:1;
    text-align:center;
    font-size:17px;
    line-height:1.2;
    font-weight:800;
    white-space:nowrap;
}

.brand-title span{
    display:block;
    color:#ffd700;
    font-size:8px;
    margin-top:3px;
    letter-spacing:.4px;
}

.header-right{
    gap:5px;
    width:auto;
}

.header-add-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px solid white;
    background:#ffd700;
    color:#0b3c5d;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:800;
    cursor:pointer;
}

/* =====================================================
   FEED
===================================================== */

.feed-container{
    position:fixed;
    top:65px;
    left:0;
    right:0;
    bottom:0;

    width:100%;
    max-width:480px;
    margin:0 auto;

    overflow-y:auto;
    overflow-x:hidden;

    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
}

.feed-container::-webkit-scrollbar{
    display:none;
}

/* EXACT SCREEN CARD */

.news-card{
    width:100%;
    height:calc(100vh - 65px);
    min-height:calc(100vh - 65px);
    max-height:calc(100vh - 65px);

    background:#fff;

    display:grid;
    grid-template-rows:
        minmax(190px,34vh)
        minmax(0,1fr)
        54px;

    scroll-snap-align:start;
    scroll-snap-stop:always;

    overflow:hidden;
}

/* =====================================================
   MEDIA
===================================================== */

.news-media{
    width:100%;
    height:100%;

    position:relative;

    background:#edf2f7;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-bottom:2px solid #ffd700;
}

.news-media img,
.news-media video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.news-media video{
    background:#000;
}

.badge{
    position:absolute;
    top:12px;
    left:12px;
    z-index:5;

    max-width:70%;

    background:#e02424;
    color:white;

    padding:5px 9px;
    border-radius:4px;

    font-size:10px;
    font-weight:800;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.watermark{
    position:absolute;
    right:9px;
    bottom:8px;

    background:rgba(11,60,93,.88);
    color:#ffd700;

    padding:4px 7px;
    border-radius:4px;

    font-size:9px;
    font-weight:700;
}

/* =====================================================
   NEWS CONTENT
===================================================== */

.news-body{
    min-height:0;

    padding:
        11px 16px
        8px;

    overflow:hidden;

    display:flex;
    flex-direction:column;
}

.news-title{
    color:#0b3c5d;

    font-size:
        clamp(17px,4.8vw,21px);

    line-height:1.28;

    font-weight:800;

    margin-bottom:6px;

    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.news-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:8px;

    padding-bottom:6px;
    margin-bottom:7px;

    border-bottom:1px dashed #cbd5e1;

    color:#64748b;

    font-size:10px;

    flex-shrink:0;
}

.news-meta span{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.news-text{
    color:#334155;

    font-size:
        clamp(13px,3.8vw,15px);

    line-height:1.48;

    text-align:left;

    white-space:pre-wrap;

    overflow-y:auto;
    overflow-x:hidden;

    padding-right:3px;

    flex:1;
}

.news-text::-webkit-scrollbar{
    width:3px;
}

.news-text::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border-radius:5px;
}

/* =====================================================
   FOOTER
===================================================== */

.footer{
    height:54px;
    min-height:54px;

    background:#07263d;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:
        7px 18px;

    border-top:1px solid rgba(255,215,0,.25);
}

.action{
    border:0;
    background:none;

    color:#ffd700;

    cursor:pointer;

    font-size:13px;
    font-weight:800;

    padding:8px 14px;
    border-radius:8px;

    min-width:100px;
}

.action:active{
    transform:scale(.96);
}

.like.active{
    color:#ff4b5c;
    background:rgba(255,255,255,.07);
}

.share{
    color:#22c55e;
}

/* =====================================================
   EMPTY
===================================================== */

.empty{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:20px;
    color:white;
}

.empty-box{
    background:#0b3c5d;

    border:1px solid #ffd700;

    border-radius:15px;

    padding:25px;

    max-width:330px;
}

.empty-box h3{
    color:#ffd700;
    margin:10px 0;
}

.empty-box p{
    font-size:13px;
    line-height:1.5;
}

/* =====================================================
   MODAL
===================================================== */

.modal-bg{
    position:fixed;
    inset:0;

    z-index:1000;

    display:none;
    align-items:center;
    justify-content:center;

    padding:12px;

    background:rgba(0,0,0,.76);
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:440px;

    max-height:
        calc(100vh - 30px);

    overflow-y:auto;

    background:#fff;

    border-radius:18px;

    padding:21px;

    position:relative;
}

.modal::-webkit-scrollbar{
    display:none;
}

.close{
    position:absolute;

    right:13px;
    top:7px;

    width:35px;
    height:35px;

    border:0;

    background:none;

    color:#64748b;

    font-size:28px;

    cursor:pointer;
}

.modal h3{
    color:#0b3c5d;

    margin-bottom:16px;

    padding-bottom:9px;

    border-bottom:2px solid #eee;
}

label{
    display:block;

    color:#475569;

    font-size:13px;

    font-weight:bold;

    margin-bottom:5px;
}

input,
textarea,
select{
    width:100%;

    padding:11px;

    margin-bottom:12px;

    border:1px solid #cbd5e1;

    border-radius:8px;

    background:#f8fafc;

    font-size:14px;

    outline:none;
}

textarea{
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#0b3c5d;
}

.file-box{
    border:2px dashed #cbd5e1;

    padding:10px;

    border-radius:8px;

    margin-bottom:12px;

    background:#f1f5f9;
}

.file-box input{
    margin:0;
    padding:4px;
    border:0;
    background:transparent;
}

.post-btn{
    width:100%;

    padding:13px;

    border:0;

    border-radius:8px;

    background:#0b3c5d;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;
}

.post-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.status{
    min-height:20px;

    margin-bottom:8px;

    text-align:center;

    font-size:13px;

    line-height:1.4;
}

/* =====================================================
   PROFILE
===================================================== */

.profile-card{
    text-align:center;
}

.guest-avatar{
    width:75px;
    height:75px;

    border-radius:50%;

    background:#0b3c5d;

    color:#ffd700;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:35px;

    margin:3px auto 12px;

    border:3px solid #ffd700;
}

.guest-name{
    font-size:19px;

    font-weight:800;

    color:#0b3c5d;
}

.guest-text{
    color:#64748b;

    font-size:13px;

    margin:6px 0 16px;
}

.profile-row{
    text-align:left;

    background:#f8fafc;

    padding:11px;

    border-radius:9px;

    margin-bottom:8px;

    font-size:13px;
}

.profile-row strong{
    color:#0b3c5d;
}

.notify-btn{
    width:100%;

    border:0;

    border-radius:8px;

    padding:12px;

    background:#ffd700;

    color:#0b3c5d;

    font-weight:800;

    cursor:pointer;

    margin-top:3px;
}

.notification-open-btn{
    width:100%;

    border:1px solid #0b3c5d;

    border-radius:8px;

    padding:11px;

    background:#fff;

    color:#0b3c5d;

    font-weight:800;

    cursor:pointer;

    margin-top:8px;
}

/* =====================================================
   NOTIFICATIONS
===================================================== */

.notification-list{
    max-height:55vh;

    overflow-y:auto;
}

.notification-item{
    padding:12px;

    border-bottom:1px solid #e2e8f0;
}

.notification-item strong{
    color:#0b3c5d;

    font-size:13px;
}

.notification-item small{
    display:block;

    color:#64748b;

    margin-top:4px;

    font-size:11px;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;

    z-index:3000;

    left:50%;
    bottom:22px;

    transform:translateX(-50%);

    background:#0b3c5d;

    color:#fff;

    border:1px solid #ffd700;

    border-radius:9px;

    padding:11px 17px;

    display:none;

    max-width:90%;

    text-align:center;

    font-size:13px;
}

/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:360px){

    .brand-title{
        font-size:14px;
    }

    .brand-title span{
        font-size:7px;
    }

    .news-card{
        grid-template-rows:
            minmax(165px,31vh)
            minmax(0,1fr)
            52px;
    }

    .news-body{
        padding:
            9px 13px 6px;
    }

    .news-title{
        font-size:16px;
    }

    .news-text{
        font-size:12.5px;
        line-height:1.42;
    }

    .action{
        font-size:12px;
        min-width:90px;
        padding:7px 9px;
    }
}

/* =====================================================
   TALL MOBILE
===================================================== */

@media(min-height:800px){

    .news-card{
        grid-template-rows:
            minmax(220px,36vh)
            minmax(0,1fr)
            56px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="top-navbar">

    <div class="header-left">

        <button
            class="profile-icon"
            id="profileBtn"
            type="button"
            aria-label="Profile">

            👤

        </button>

    </div>


    <div class="brand-title">

        ప్రాంతీయ ప్రతిధ్వని న్యూస్

        <span>
            PRANTHIYA PRATHIDHWANI NEWS • LIVE
        </span>

    </div>


    <div class="header-right">

        <button
            class="notification-icon"
            id="notificationBtn"
            type="button"
            aria-label="Notifications">

            🔔

        </button>


        <button
            class="header-add-btn"
            id="openUpload"
            type="button"
            aria-label="Upload News">

            +

        </button>

    </div>

</header>


<!-- =====================================================
     NEWS FEED
===================================================== -->

<main
    class="feed-container"
    id="newsFeed">

    <div class="empty">

        NEWS Loading...

    </div>

</main>


<!-- =====================================================
     UPLOAD MODAL
===================================================== -->

<div
    class="modal-bg"
    id="uploadModal">

    <div class="modal">

        <button
            class="close"
            id="closeUpload"
            type="button">

            ×

        </button>


        <h3>
            📰 కొత్త NEWS జోడించండి
        </h3>


        <label>
            NEWS Category
        </label>

        <input
            id="newsBadge"
            type="text"
            placeholder="బ్రేకింగ్ న్యూస్ / జిల్లా వార్తలు">


        <label>
            NEWS Headline
        </label>

        <input
            id="newsTitle"
            type="text"
            placeholder="NEWS ముఖ్య హెడ్‌లైన్">


        <label>
            District / Location
        </label>

        <input
            id="newsLocation"
            type="text"
            placeholder="నెల్లూరు / గుంటూరు / తిరుపతి">


        <label>
            Image / Video
        </label>

        <div class="file-box">

            <input
                id="newsMediaFile"
                type="file"
                accept="image/*,video/*">

        </div>


        <label>
            NEWS Matter
        </label>

        <textarea
            id="newsBody"
            rows="5"
            placeholder="NEWS పూర్తి వివరాలు..."></textarea>


        <div
            class="status"
            id="uploadStatus">
        </div>


        <button
            class="post-btn"
            id="postNewsBtn"
            type="button">

            🚀 NEWS POST చేయండి

        </button>

    </div>

</div>


<!-- =====================================================
     PROFILE MODAL
===================================================== -->

<div
    class="modal-bg"
    id="profileModal">

    <div class="modal">

        <button
            class="close"
            id="closeProfile"
            type="button">

            ×

        </button>


        <div class="profile-card">

            <div class="guest-avatar">
                👤
            </div>


            <div class="guest-name">
                Guest User
            </div>


            <div class="guest-text">
                Login అవసరం లేదు
            </div>


            <div class="profile-row">

                <strong>
                    📍 District
                </strong>

                <br>

                <span>
                    All Districts
                </span>

            </div>


            <div class="profile-row">

                <strong>
                    📰 Account
                </strong>

                <br>

                <span>
                    Guest Mode
                </span>

            </div>


            <div class="profile-row">

                <strong>
                    🔔 Notifications
                </strong>

                <br>

                <span id="notificationState">
                    Checking...
                </span>

            </div>


            <button
                class="notify-btn"
                id="enableNotifications"
                type="button">

                🔔 Notifications Allow చేయండి

            </button>


            <button
                class="notification-open-btn"
                id="openNotificationList"
                type="button">

                🔔 Notifications చూడండి

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     NOTIFICATION MODAL
===================================================== -->

<div
    class="modal-bg"
    id="notificationModal">

    <div class="modal">

        <button
            class="close"
            id="closeNotifications"
            type="button">

            ×

        </button>


        <h3>
            🔔 Notifications
        </h3>


        <div
            class="notification-list"
            id="notificationList">

            <div class="notification-item">
                ఇంకా కొత్త NEWS notifications లేవు.
            </div>

        </div>

    </div>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast">
</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://eaowxilhfzyukzetgqxo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Z3xsADypaOjX8GEQEOLUdg_vbxynHRx";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const uploadModal =
document.getElementById("uploadModal");

const profileModal =
document.getElementById("profileModal");

const notificationModal =
document.getElementById("notificationModal");

const newsFeed =
document.getElementById("newsFeed");

const uploadStatus =
document.getElementById("uploadStatus");

const postNewsBtn =
document.getElementById("postNewsBtn");


/* =====================================================
   OPEN / CLOSE MODALS
===================================================== */

document
.getElementById("openUpload")
.addEventListener(
    "click",
    function(){

        uploadModal.classList.add("show");

    }
);


document
.getElementById("closeUpload")
.addEventListener(
    "click",
    function(){

        uploadModal.classList.remove("show");

    }
);


document
.getElementById("profileBtn")
.addEventListener(
    "click",
    function(){

        profileModal.classList.add("show");

        updateNotificationStatus();

    }
);


document
.getElementById("closeProfile")
.addEventListener(
    "click",
    function(){

        profileModal.classList.remove("show");

    }
);


document
.getElementById("notificationBtn")
.addEventListener(
    "click",
    function(){

        notificationModal.classList.add("show");

        renderNotifications();

    }
);


document
.getElementById("openNotificationList")
.addEventListener(
    "click",
    function(){

        profileModal.classList.remove("show");

        notificationModal.classList.add("show");

        renderNotifications();

    }
);


document
.getElementById("closeNotifications")
.addEventListener(
    "click",
    function(){

        notificationModal.classList.remove("show");

    }
);


/* =====================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
===================================================== */

uploadModal.addEventListener(
    "click",
    function(event){

        if(event.target === uploadModal){

            uploadModal.classList.remove("show");

        }

    }
);


profileModal.addEventListener(
    "click",
    function(event){

        if(event.target === profileModal){

            profileModal.classList.remove("show");

        }

    }
);


notificationModal.addEventListener(
    "click",
    function(event){

        if(event.target === notificationModal){

            notificationModal.classList.remove("show");

        }

    }
);


/* =====================================================
   NOTIFICATIONS
===================================================== */

document
.getElementById("enableNotifications")
.addEventListener(
    "click",
    async function(){

        if(!("Notification" in window)){

            showToast(
                "❌ ఈ browser Notifications support చేయదు."
            );

            return;

        }


        if(
            Notification.permission ===
            "denied"
        ){

            showToast(
                "🔕 Notifications Block అయ్యాయి. Browser Site Settingsలో Notifications → Allow చేయండి."
            );

            return;

        }


        try{

            const permission =
                await Notification.requestPermission();


            updateNotificationStatus();


            if(permission === "granted"){

                showToast(
                    "🔔 Notifications ON అయ్యాయి."
                );


                new Notification(
                    "ప్రాంతీయ ప్రతిధ్వని NEWS",
                    {
                        body:
                        "కొత్త NEWS notifications ఇప్పుడు వస్తాయి."
                    }
                );

            }else{

                showToast(
                    "🔕 Notifications Allow చేయలేదు."
                );

            }

        }catch(error){

            console.error(error);

            showToast(
                "❌ Notification permission error."
            );

        }

    }
);


/* =====================================================
   NOTIFICATION STATUS
===================================================== */

function updateNotificationStatus(){

    const state =
        document.getElementById(
            "notificationState"
        );


    if(!("Notification" in window)){

        state.textContent =
            "Browser support లేదు";

        return;

    }


    if(
        Notification.permission ===
        "granted"
    ){

        state.textContent =
            "🔔 Notifications ON";

    }
    else if(
        Notification.permission ===
        "denied"
    ){

        state.textContent =
            "🔕 Notifications OFF";

    }
    else{

        state.textContent =
            "⚠️ Permission అవసరం";

    }

}


/* =====================================================
   UPLOAD NEWS
===================================================== */

postNewsBtn.addEventListener(
    "click",
    uploadNews
);


async function uploadNews(){

    const badge =
        document
        .getElementById("newsBadge")
        .value
        .trim();


    const title =
        document
        .getElementById("newsTitle")
        .value
        .trim();


    const location =
        document
        .getElementById("newsLocation")
        .value
        .trim();


    const body =
        document
        .getElementById("newsBody")
        .value
        .trim();


    const file =
        document
        .getElementById("newsMediaFile")
        .files[0];


    if(!title){

        uploadStatus.textContent =
            "❌ NEWS Headline ఇవ్వండి.";

        return;

    }


    if(!body){

        uploadStatus.textContent =
            "❌ NEWS Matter ఇవ్వండి.";

        return;

    }


    /* 50 MB maximum */

    if(
        file &&
        file.size >
        50 * 1024 * 1024
    ){

        uploadStatus.textContent =
            "❌ File 50MB లోపు ఉండాలి.";

        return;

    }


    postNewsBtn.disabled = true;

    postNewsBtn.textContent =
        "⏳ POSTING...";


    try{

        let mediaURL = null;

        let mediaType = null;


        /* =============================================
           MEDIA
        ============================================= */

        if(file){

            uploadStatus.textContent =
                "⏳ Media uploading...";


            const extension =
                file.name
                .split(".")
                .pop()
                .toLowerCase();


            const filename =
                Date.now() +
                "_" +
                Math.random()
                .toString(36)
                .substring(2,9) +
                "." +
                extension;


            const path =
                "news/" +
                filename;


            const uploadResult =
                await db.storage
                .from("news-media")
                .upload(
                    path,
                    file,
                    {
                        cacheControl:"3600",
                        upsert:false,
                        contentType:file.type
                    }
                );


            if(uploadResult.error){

                throw new Error(
                    uploadResult.error.message
                );

            }


            const publicResult =
                db.storage
                .from("news-media")
                .getPublicUrl(path);


            mediaURL =
                publicResult.data.publicUrl;


            mediaType =
                file.type.startsWith("video/")
                ? "video"
                : "image";

        }


        /* =============================================
           DATABASE
        ============================================= */

        uploadStatus.textContent =
            "⏳ NEWS saving...";


        const result =
            await db
            .from("news")
            .insert({

                badge:
                    badge || null,

                title:
                    title,

                location:
                    location || null,

                body:
                    body,

                media_url:
                    mediaURL,

                media_type:
                    mediaType,

                created_at:
                    new Date().toISOString()

            });


        if(result.error){

            throw new Error(
                result.error.message
            );

        }


        /* =============================================
           SUCCESS
        ============================================= */

        clearUploadForm();


        uploadModal.classList.remove(
            "show"
        );


        showToast(
            "✅ NEWS successfully posted"
        );


        /*
           IMPORTANT:
           New NEWS always loads from latest
           to oldest, so uploaded NEWS appears first.
        */

        await loadNews();


    }catch(error){

        console.error(
            "UPLOAD ERROR:",
            error
        );


        uploadStatus.textContent =
            "❌ " + error.message;


        showToast(
            "❌ NEWS upload failed"
        );

    }finally{

        postNewsBtn.disabled = false;

        postNewsBtn.textContent =
            "🚀 NEWS POST చేయండి";

    }

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearUploadForm(){

    document.getElementById(
        "newsBadge"
    ).value = "";


    document.getElementById(
        "newsTitle"
    ).value = "";


    document.getElementById(
        "newsLocation"
    ).value = "";


    document.getElementById(
        "newsBody"
    ).value = "";


    document.getElementById(
        "newsMediaFile"
    ).value = "";


    uploadStatus.textContent = "";

}


/* =====================================================
   LOAD NEWS
===================================================== */

async function loadNews(){

    const cutoff =
        new Date(
            Date.now() -
            24 * 60 * 60 * 1000
        ).toISOString();


    const result =
        await db
        .from("news")
        .select("*")
        .gte(
            "created_at",
            cutoff
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(result.error){

        console.error(
            result.error
        );


        newsFeed.innerHTML = `

            <div class="empty">

                <div class="empty-box">

                    <div style="font-size:45px">
                        ⚠️
                    </div>

                    <h3>
                        NEWS Load Error
                    </h3>

                    <p>
                        Supabase table / RLS check చేయండి.
                    </p>

                </div>

            </div>

        `;

        return;

    }


    const news =
        result.data || [];


    if(news.length === 0){

        newsFeed.innerHTML = `

            <div class="empty">

                <div class="empty-box">

                    <div style="font-size:45px">
                        📰
                    </div>

                    <h3>
                        ప్రస్తుతం NEWS లేదు
                    </h3>

                    <p>
                        ➕ button నొక్కి NEWS POST చేయండి.
                    </p>

                </div>

            </div>

        `;

        return;

    }


    /*
       Latest NEWS = first card
    */

    newsFeed.innerHTML = "";


    news.forEach(
        function(item){

            newsFeed.appendChild(
                createCard(item)
            );

        }
    );

}


/* =====================================================
   CREATE NEWS CARD
===================================================== */

function createCard(news){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "news-card";


    let media = `

        <div style="
            font-size:55px;
            color:#0b3c5d;
        ">
            📰
        </div>

    `;


    if(news.media_url){

        if(
            news.media_type ===
            "video"
        ){

            media = `

                <video
                    src="${escapeValue(news.media_url)}"
                    controls
                    playsinline
                    preload="metadata">
                </video>

            `;

        }else{

            media = `

                <img
                    src="${escapeValue(news.media_url)}"
                    alt="NEWS"
                    loading="eager">

            `;

        }

    }


    const liked =
        localStorage.getItem(
            "liked_" + news.id
        ) === "1";


    const count =
        parseInt(
            localStorage.getItem(
                "count_" + news.id
            ) || "0",
            10
        );


    card.innerHTML = `

        <div class="news-media">

            ${
                news.badge
                ?
                `
                <div class="badge">
                    ${escapeText(news.badge)}
                </div>
                `
                :
                ""
            }


            ${media}


            <div class="watermark">
                ప్రాంతీయ ప్రతిధ్వని NEWS
            </div>

        </div>


        <div class="news-body">

            <h2 class="news-title">
                ${escapeText(news.title)}
            </h2>


            <div class="news-meta">

                <span>
                    📍
                    ${escapeText(
                        news.location ||
                        "India"
                    )}
                </span>


                <span>
                    ${formatDate(
                        news.created_at
                    )}
                </span>

            </div>


            <p class="news-text">
                ${escapeText(
                    news.body || ""
                )}
            </p>

        </div>


        <div class="footer">

            <button
                type="button"
                class="action like ${
                    liked ? "active" : ""
                }">

                ${
                    liked
                    ? "❤️"
                    : "🤍"
                }

                లైక్
                (<span>${count}</span>)

            </button>


            <button
                type="button"
                class="action share">

                💚 షేర్

            </button>

        </div>

    `;


    card
    .querySelector(".like")
    .addEventListener(
        "click",
        function(){

            toggleLike(
                this,
                news.id
            );

        }
    );


    card
    .querySelector(".share")
    .addEventListener(
        "click",
        function(){

            shareNews(
                news.title,
                news.body || ""
            );

        }
    );


    return card;

}


/* =====================================================
   LIKE
===================================================== */

function toggleLike(
    button,
    id
){

    const key =
        "liked_" + id;

    const countKey =
        "count_" + id;


    let liked =
        localStorage.getItem(key)
        === "1";


    let count =
        parseInt(
            localStorage.getItem(
                countKey
            ) || "0",
            10
        );


    if(liked){

        liked = false;

        count =
            Math.max(
                0,
                count - 1
            );

        localStorage.removeItem(
            key
        );

    }else{

        liked = true;

        count++;

        localStorage.setItem(
            key,
            "1"
        );

    }


    localStorage.setItem(
        countKey,
        count
    );


    button.classList.toggle(
        "active",
        liked
    );


    button.innerHTML =
        `${liked ? "❤️" : "🤍"}
         లైక్
         (<span>${count}</span>)`;

}


/* =====================================================
   SHARE
===================================================== */

async function shareNews(
    title,
    body
){

    const text =
`${title}

${body}

ప్రాంతీయ ప్రతిధ్వని NEWS`;


    if(navigator.share){

        try{

            await navigator.share({

                title:title,

                text:text

            });

            return;

        }catch(error){

            if(
                error.name ===
                "AbortError"
            ){

                return;

            }

        }

    }


    window.open(
        "https://wa.me/?text=" +
        encodeURIComponent(text),
        "_blank"
    );

}


/* =====================================================
   REALTIME
===================================================== */

db.channel(
    "news-live"
)
.on(
    "postgres_changes",
    {
        event:"INSERT",
        schema:"public",
        table:"news"
    },
    function(payload){

        /*
           New NEWS automatically becomes
           first/latest NEWS.
        */

        loadNews();


        const news =
            payload.new;


        addNotification(
            news
        );


        /*
           Browser notification only when
           permission is granted.
        */

        if(
            "Notification" in window &&
            Notification.permission ===
            "granted"
        ){

            try{

                new Notification(
                    "📰 కొత్త NEWS",
                    {
                        body:
                            news.title ||
                            "కొత్త NEWS వచ్చింది."
                    }
                );

            }catch(error){

                console.log(
                    error
                );

            }

        }

    }
)
.subscribe();


/* =====================================================
   LOCAL NOTIFICATIONS
===================================================== */

function addNotification(news){

    const list =
        JSON.parse(
            localStorage.getItem(
                "news_notifications"
            ) || "[]"
        );


    list.unshift({

        title:
            news.title,

        location:
            news.location,

        time:
            new Date().toISOString()

    });


    localStorage.setItem(
        "news_notifications",
        JSON.stringify(
            list.slice(0,30)
        )
    );


    renderNotifications();

}


/* =====================================================
   RENDER NOTIFICATIONS
===================================================== */

function renderNotifications(){

    const container =
        document.getElementById(
            "notificationList"
        );


    const list =
        JSON.parse(
            localStorage.getItem(
                "news_notifications"
            ) || "[]"
        );


    if(list.length === 0){

        container.innerHTML = `

            <div class="notification-item">

                ఇంకా కొత్త NEWS notifications లేవు.

            </div>

        `;

        return;

    }


    container.innerHTML =
        list
        .map(
            function(item){

                return `

                    <div class="notification-item">

                        <strong>
                            📰
                            ${escapeText(
                                item.title
                            )}
                        </strong>


                        <small>
                            📍
                            ${escapeText(
                                item.location ||
                                "India"
                            )}
                        </small>


                        <small>
                            ${formatDate(
                                item.time
                            )}
                        </small>

                    </div>

                `;

            }
        )
        .join("");

}


/* =====================================================
   DATE
===================================================== */

function formatDate(date){

    return new Date(date)
    .toLocaleString(
        "te-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeText(value){

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeValue(value){

    return escapeText(value);

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.style.display =
        "block";


    setTimeout(
        function(){

            toast.style.display =
                "none";

        },
        3000
    );

}


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
    loadNews,
    60000
);


/* =====================================================
   START
===================================================== */

loadNews();

updateNotificationStatus();

renderNotifications();

</script>
